# Continuous integration for the Keptex engine packages:
#   @keptex/core, @keptex/passkey, @keptex/stellar-root, @keptex/ledger-sync.
#
# Every action is pinned to a commit SHA (the tag it was taken from is in the
# trailing comment). pnpm comes from the packageManager field of package.json.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      # Includes the published vectors: core passwords, Stellar Root
      # conformance and Ed25519 edge cases, Ledger Sync shared vectors.
      - name: Test
        run: pnpm -r test
